---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: patchjobs.kangalpatch.ozalp.dk
spec:
  group: kangalpatch.ozalp.dk
  names:
    kind: PatchJob
    listKind: PatchJobList
    plural: patchjobs
    singular: patchjob
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.currentTalosVersion
      name: TalosCurrent
      type: string
    - jsonPath: .status.targetTalosVersion
      name: TalosTarget
      type: string
    - jsonPath: .status.currentKubernetesVersion
      name: K8sCurrent
      type: string
    - jsonPath: .status.targetKubernetesVersion
      name: K8sTarget
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PatchJob is the Schema for the patchjobs API
          PatchJobs are owned by their parent PatchPlan and will be automatically deleted
          when the PatchPlan is deleted. Completed/failed PatchJobs are automatically
          cleaned up after PatchJobTTL (7 days).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PatchJobSpec defines the desired state of PatchJob
            properties:
              nodeName:
                description: NodeName is the name of the node to patch
                type: string
              patchPlanRef:
                description: PatchPlanRef references the parent PatchPlan
                type: string
              target:
                description: Target defines the target Talos and/or Kubernetes version
                  specification
                properties:
                  installer:
                    description: |-
                      Installer specifies the installer type (e.g., "aws", "azure", "nocloud")
                      Required when source=factory
                    type: string
                  kubernetesVersion:
                    description: |-
                      KubernetesVersion is the desired Kubernetes version (e.g., v1.32.4). Omit to leave the
                      Kubernetes version untouched and only upgrade TalosVersion.
                      Requires ControlPlaneFirst and PatchControlPlane to be true, since kubelets must never run
                      newer than the control plane they connect to.
                    type: string
                  schematicID:
                    description: |-
                      SchematicID is the Talos factory schematic ID
                      Required when source=factory
                    type: string
                  secureBoot:
                    default: false
                    description: |-
                      SecureBoot enables secure boot for the installer image
                      Only applicable when source=factory
                    type: boolean
                  source:
                    default: ghcr
                    description: 'Source specifies the image source: "factory" or
                      "ghcr"'
                    enum:
                    - factory
                    - ghcr
                    type: string
                  talosVersion:
                    description: |-
                      TalosVersion is the desired Talos OS version (e.g., v1.12.1). Omit to leave the Talos
                      version untouched and only upgrade KubernetesVersion.
                    type: string
                type: object
            required:
            - nodeName
            - target
            type: object
            x-kubernetes-validations:
            - message: at least one of target.talosVersion or target.kubernetesVersion
                must be set
              rule: size(self.target.talosVersion) > 0 || size(self.target.kubernetesVersion)
                > 0
          status:
            description: PatchJobStatus defines the observed state of PatchJob
            properties:
              completionTime:
                description: CompletionTime is when the patch operation completed
                  (success or failure)
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the PatchJob's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentKubernetesVersion:
                description: CurrentKubernetesVersion is the kubelet version before
                  upgrade, as reported by the node
                type: string
              currentTalosVersion:
                description: CurrentTalosVersion is the Talos version before upgrade
                type: string
              message:
                description: Message contains human-readable message about current
                  state
                type: string
              phase:
                description: Phase represents the current phase of the patch operation
                enum:
                - Pending
                - Draining
                - Upgrading
                - Rebooting
                - UpgradingKubernetes
                - ValidatingKubernetes
                - Completed
                - Failed
                type: string
              startTime:
                description: StartTime is when the patch operation started
                format: date-time
                type: string
              targetKubernetesVersion:
                description: TargetKubernetesVersion is the extracted Kubernetes version
                  tag for display (e.g., v1.32.4)
                type: string
              targetTalosVersion:
                description: TargetTalosVersion is the extracted Talos version tag
                  for display (e.g., v1.11.5)
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
