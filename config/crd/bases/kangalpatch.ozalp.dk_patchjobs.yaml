---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: patchjobs.kangalpatch.ozalp.dk
spec:
  group: kangalpatch.ozalp.dk
  names:
    kind: PatchJob
    listKind: PatchJobList
    plural: patchjobs
    singular: patchjob
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.currentTalosVersion
      name: TalosCurrent
      type: string
    - jsonPath: .status.targetTalosVersion
      name: TalosTarget
      type: string
    - jsonPath: .status.currentKubernetesVersion
      name: K8sCurrent
      type: string
    - jsonPath: .status.targetKubernetesVersion
      name: K8sTarget
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PatchJob is the Schema for the patchjobs API
          PatchJobs are owned by their parent PatchPlan and will be automatically deleted
          when the PatchPlan is deleted. Finished PatchJobs are removed once the PatchPlan's
          spec.retention.history has passed.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PatchJobSpec defines the desired state of PatchJob
            properties:
              group:
                description: |-
                  Group is the PatchPlan group that scheduled the node; its Lease counts against that group's
                  concurrency.
                type: string
              nodeName:
                description: NodeName is the name of the node to patch
                type: string
              patchPlanRef:
                description: PatchPlanRef references the parent PatchPlan
                type: string
              target:
                description: Target defines the target Talos and/or Kubernetes version
                  specification
                properties:
                  autoUpdate:
                    description: |-
                      AutoUpdate makes this PatchPlan a template that creates a child PatchPlan per Talos release.
                      TalosVersion and KubernetesVersion must be omitted when it is enabled.
                    properties:
                      allow:
                        default: patch
                        description: |-
                          Allow is the largest version change applied automatically, relative to the lowest Talos version
                          running on the selected nodes. "patch" only moves within the current minor (1.13.2 -> 1.13.5);
                          "minor" also allows stepping to the next minor (1.12.6 -> 1.13.x), never skipping one.
                        enum:
                        - patch
                        - minor
                        type: string
                      checkInterval:
                        default: 1h
                        description: CheckInterval is how often to look for a new
                          release (minimum 1m).
                        pattern: ^([0-9]+(\.[0-9]+)?(s|m|h))+$
                        type: string
                      enabled:
                        description: Enabled turns the PatchPlan into an auto-update
                          template.
                        type: boolean
                      minReleaseAge:
                        default: 0s
                        description: |-
                          MinReleaseAge is how old a release must be before it is used, so a release that is pulled or
                          hot-fixed right after publication is never rolled out.
                        pattern: ^([0-9]+(\.[0-9]+)?(s|m|h))+$
                        type: string
                    required:
                    - enabled
                    type: object
                  installer:
                    description: |-
                      Installer specifies the installer type (e.g., "aws", "azure", "nocloud")
                      Required when source=factory
                    type: string
                  kubernetesVersion:
                    description: |-
                      KubernetesVersion is the desired Kubernetes version (e.g., v1.32.4). Omit to leave the
                      Kubernetes version untouched and only upgrade TalosVersion.
                      Preflight requires strategy.order to schedule every control plane node before any worker
                      node, since kubelets must never run newer than the control plane they connect to.
                    pattern: ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$
                    type: string
                  schematicID:
                    description: |-
                      SchematicID is the Talos factory schematic ID.
                      When source=factory and this is omitted, each node keeps the schematic it is currently running.
                    type: string
                  secureBoot:
                    default: false
                    description: |-
                      SecureBoot enables secure boot for the installer image
                      Only applicable when source=factory
                    type: boolean
                  source:
                    default: ghcr
                    description: 'Source specifies the image source: "factory" or
                      "ghcr"'
                    enum:
                    - factory
                    - ghcr
                    type: string
                  talosVersion:
                    description: |-
                      TalosVersion is the desired Talos OS version (e.g., v1.12.1). Omit to leave the Talos
                      version untouched and only upgrade KubernetesVersion.
                    pattern: ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: target.talosVersion is immutable; create a new PatchPlan
                    for a new version
                  rule: 'has(self.talosVersion) ? (has(oldSelf.talosVersion) && self.talosVersion
                    == oldSelf.talosVersion) : !has(oldSelf.talosVersion)'
                - message: target.kubernetesVersion is immutable; create a new PatchPlan
                    for a new version
                  rule: 'has(self.kubernetesVersion) ? (has(oldSelf.kubernetesVersion)
                    && self.kubernetesVersion == oldSelf.kubernetesVersion) : !has(oldSelf.kubernetesVersion)'
            required:
            - nodeName
            - target
            type: object
            x-kubernetes-validations:
            - message: at least one of target.talosVersion or target.kubernetesVersion
                must be set
              rule: has(self.target.talosVersion) || has(self.target.kubernetesVersion)
          status:
            description: PatchJobStatus defines the observed state of PatchJob
            properties:
              completionTime:
                description: CompletionTime is when the patch operation completed
                  (success or failure)
                format: date-time
                type: string
              currentKubernetesVersion:
                description: CurrentKubernetesVersion is the kubelet version before
                  upgrade, as reported by the node
                type: string
              currentTalosVersion:
                description: CurrentTalosVersion is the Talos version before upgrade
                type: string
              drainStartTime:
                description: DrainStartTime is when draining began; the plan's drainTimeout
                  counts from here
                format: date-time
                type: string
              kubernetesUpgradeStartTime:
                description: |-
                  KubernetesUpgradeStartTime is when the Kubernetes upgrade patch was applied; the plan's
                  kubernetesUpgradeTimeout counts from here
                format: date-time
                type: string
              message:
                description: Message contains human-readable message about current
                  state
                type: string
              phase:
                description: Phase represents the current phase of the patch operation
                enum:
                - Pending
                - Draining
                - Upgrading
                - Rebooting
                - UpgradingKubernetes
                - ValidatingKubernetes
                - Completed
                - Failed
                type: string
              preUpgradeBootID:
                description: |-
                  PreUpgradeBootID is the node's boot ID when the Talos upgrade was started, used to detect that
                  the node rebooted
                type: string
              rebootStartTime:
                description: RebootStartTime is when the Talos upgrade was started;
                  the plan's rebootTimeout counts from here
                format: date-time
                type: string
              startTime:
                description: StartTime is when the patch operation started
                format: date-time
                type: string
              targetKubernetesVersion:
                description: TargetKubernetesVersion is the extracted Kubernetes version
                  tag for display (e.g., v1.32.4)
                type: string
              targetTalosVersion:
                description: TargetTalosVersion is the extracted Talos version tag
                  for display (e.g., v1.11.5)
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
