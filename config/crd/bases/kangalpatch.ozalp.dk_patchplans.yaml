---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: patchplans.kangalpatch.ozalp.dk
spec:
  group: kangalpatch.ozalp.dk
  names:
    kind: PatchPlan
    listKind: PatchPlanList
    plural: patchplans
    singular: patchplan
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.targetTalosVersion
      name: TalosTarget
      type: string
    - jsonPath: .status.targetKubernetesVersion
      name: K8sTarget
      type: string
    - jsonPath: .status.totalNodes
      name: Total
      type: integer
    - jsonPath: .status.runningNodes
      name: Running
      type: integer
    - jsonPath: .status.completedNodes
      name: Completed
      type: integer
    - jsonPath: .status.failedNodes
      name: Failed
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PatchPlan is the Schema for the patchplans API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PatchPlanSpec defines the desired state of PatchPlan
            properties:
              cancelled:
                default: false
                description: |-
                  Cancelled permanently stops the patching operation. Unlike Paused, scheduling of new
                  nodes stops for good and the plan moves to the terminal Cancelled phase. PatchJobs
                  already in progress are not affected and run to completion.
                type: boolean
              delayBetweenNodes:
                default: 5m
                description: DelayBetweenNodes is the delay between patching individual
                  nodes (e.g., "30s", "2m")
                pattern: ^([0-9]+(\.[0-9]+)?(s|m|h))+$
                type: string
              drainTimeout:
                default: 5m
                description: DrainTimeout is the maximum time to wait for node drain
                type: string
              failurePolicy:
                default: {}
                description: FailurePolicy defines what happens when a node fails
                  to patch.
                properties:
                  maxFailures:
                    default: 1
                    description: MaxFailures is the number of failed nodes that triggers
                      the policy. 0 is treated as 1.
                    minimum: 0
                    type: integer
                  type:
                    default: Halt
                    description: |-
                      Type is Halt (mark the plan Failed) or Pause (set spec.paused so the failure can be inspected;
                      setting paused back to false resumes and accepts the failures seen so far). Already running
                      nodes are never interrupted.
                    enum:
                    - Halt
                    - Pause
                    type: string
                type: object
              groups:
                additionalProperties:
                  description: GroupSpec configures a node group.
                  properties:
                    concurrency:
                      default: 1
                      description: Concurrency is the maximum number of nodes of this
                        group patched at the same time.
                      minimum: 1
                      type: integer
                    selector:
                      description: |-
                        Selector filters the nodes picked by spec.nodeSelector. Required for custom groups and
                        not allowed for the built-in "workers" and "controlPlane" groups.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                  type: object
                description: |-
                  Groups defines custom node groups by name. A group is a label filter over the nodes picked by
                  nodeSelector and may overlap with other groups; strategy.order decides which group schedules
                  a node matching several. The built-in groups "workers" and "controlPlane" need not be
                  declared; declaring them only sets their concurrency.
                maxProperties: 32
                type: object
              kubernetesUpgradeTimeout:
                default: 10m
                description: |-
                  KubernetesUpgradeTimeout is the maximum time to wait for the kubelet and control plane static
                  pods to report the target Kubernetes version
                type: string
              maintenance:
                description: Maintenance defines maintenance windows for patching
                  operations
                properties:
                  excludeDates:
                    description: ExcludeDates is a list of dates in YYYY-MM-DD format
                      (e.g., "2026-12-24") when patching is not allowed
                    items:
                      type: string
                    type: array
                  windows:
                    description: Windows defines time windows when patching is allowed
                    items:
                      description: MaintenanceWindow defines a time window for patching
                      properties:
                        days:
                          description: |-
                            Days is a list of weekdays when this window applies (e.g., ["Monday", "Friday"])
                            If empty or omitted, applies to all days
                          items:
                            type: string
                          type: array
                        disabled:
                          default: false
                          description: Disabled temporarily disables this maintenance
                            window
                          type: boolean
                        endTime:
                          description: EndTime is the end time in HH:MM format (e.g.,
                            "05:00")
                          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                          type: string
                        startTime:
                          description: StartTime is the start time in HH:MM format
                            (e.g., "01:00")
                          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                          type: string
                      required:
                      - endTime
                      - startTime
                      type: object
                    type: array
                type: object
              nodeSelector:
                description: |-
                  NodeSelector selects the complete population of nodes this plan may patch. Groups only
                  filter this population and never add nodes. An empty selector selects every node.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              paused:
                default: false
                description: Paused pauses the patching operation
                type: boolean
              rebootTimeout:
                default: 10m
                description: RebootTimeout is the maximum time to wait for node to
                  reboot and become ready
                type: string
              respectPDBs:
                default: true
                description: RespectPDBs indicates whether to respect PodDisruptionBudgets
                  during node drain
                type: boolean
              retention:
                default: {}
                description: Retention defines how long finished rollout history is
                  kept.
                properties:
                  history:
                    default: 168h
                    description: |-
                      History is how long the PatchJobs of a finished PatchPlan are kept after the plan completed,
                      failed or was cancelled. Only terminal PatchJobs are ever removed. Once removed the plan is
                      frozen; create a new PatchPlan to roll out again.
                    pattern: ^([0-9]+(\.[0-9]+)?(s|m|h))+$
                    type: string
                type: object
              strategy:
                default: {}
                description: Strategy defines the order in which groups are rolled
                  out.
                properties:
                  order:
                    default:
                    - controlPlane
                    - workers
                    description: |-
                      Order lists the groups from first to last. Every group completes before the next one starts,
                      and a node matching several groups is patched by the first one listed. Nodes matching no
                      listed group are not patched. The order is used exactly as written.
                    items:
                      type: string
                    maxItems: 34
                    type: array
                    x-kubernetes-list-type: set
                type: object
              talosConfig:
                description: TalosConfig contains Talos API connection information
                properties:
                  caCert:
                    description: CACert is the CA certificate for Talos API (base64
                      encoded)
                    type: string
                  clientCert:
                    description: ClientCert is the client certificate for Talos API
                      (base64 encoded)
                    type: string
                  clientKey:
                    description: ClientKey is the client key for Talos API (base64
                      encoded)
                    type: string
                  endpoints:
                    description: Endpoints is a list of Talos API endpoints
                    items:
                      type: string
                    type: array
                  secretRef:
                    description: SecretRef references a Secret containing Talos credentials
                    properties:
                      name:
                        description: Name is the name of the secret
                        type: string
                      namespace:
                        description: Namespace is the namespace of the secret
                        type: string
                    required:
                    - name
                    type: object
                type: object
              target:
                description: Target defines the target Talos and/or Kubernetes version
                  specification
                properties:
                  autoUpdate:
                    description: |-
                      AutoUpdate makes this PatchPlan a template that creates a child PatchPlan per Talos release.
                      TalosVersion and KubernetesVersion must be omitted when it is enabled.
                    properties:
                      allow:
                        default: patch
                        description: |-
                          Allow is the largest version change applied automatically, relative to the lowest Talos version
                          running on the selected nodes. "patch" only moves within the current minor (1.13.2 -> 1.13.5);
                          "minor" also allows stepping to the next minor (1.12.6 -> 1.13.x), never skipping one.
                        enum:
                        - patch
                        - minor
                        type: string
                      checkInterval:
                        default: 1h
                        description: CheckInterval is how often to look for a new
                          release (minimum 1m).
                        pattern: ^([0-9]+(\.[0-9]+)?(s|m|h))+$
                        type: string
                      enabled:
                        description: Enabled turns the PatchPlan into an auto-update
                          template.
                        type: boolean
                      minReleaseAge:
                        default: 0s
                        description: |-
                          MinReleaseAge is how old a release must be before it is used, so a release that is pulled or
                          hot-fixed right after publication is never rolled out.
                        pattern: ^([0-9]+(\.[0-9]+)?(s|m|h))+$
                        type: string
                    required:
                    - enabled
                    type: object
                  installer:
                    description: |-
                      Installer specifies the installer type (e.g., "aws", "azure", "nocloud")
                      Required when source=factory
                    type: string
                  kubernetesVersion:
                    description: |-
                      KubernetesVersion is the desired Kubernetes version (e.g., v1.32.4). Omit to leave the
                      Kubernetes version untouched and only upgrade TalosVersion.
                      Preflight requires strategy.order to schedule every control plane node before any worker
                      node, since kubelets must never run newer than the control plane they connect to.
                    type: string
                  schematicID:
                    description: |-
                      SchematicID is the Talos factory schematic ID.
                      When source=factory and this is omitted, each node keeps the schematic it is currently running.
                    type: string
                  secureBoot:
                    default: false
                    description: |-
                      SecureBoot enables secure boot for the installer image
                      Only applicable when source=factory
                    type: boolean
                  source:
                    default: ghcr
                    description: 'Source specifies the image source: "factory" or
                      "ghcr"'
                    enum:
                    - factory
                    - ghcr
                    type: string
                  talosVersion:
                    description: |-
                      TalosVersion is the desired Talos OS version (e.g., v1.12.1). Omit to leave the Talos
                      version untouched and only upgrade KubernetesVersion.
                    type: string
                type: object
            required:
            - target
            type: object
            x-kubernetes-validations:
            - message: at least one of target.talosVersion, target.kubernetesVersion
                or an enabled target.autoUpdate must be set
              rule: has(self.target.talosVersion) || has(self.target.kubernetesVersion)
                || (has(self.target.autoUpdate) && self.target.autoUpdate.enabled)
            - message: target.talosVersion and target.kubernetesVersion must be omitted
                when target.autoUpdate is enabled
              rule: '!(has(self.target.autoUpdate) && self.target.autoUpdate.enabled)
                || (!has(self.target.talosVersion) && !has(self.target.kubernetesVersion))'
          status:
            description: PatchPlanStatus defines the observed state of PatchPlan
            properties:
              autoUpdate:
                description: AutoUpdate reports the release watcher state. Only set
                  on auto-update templates.
                properties:
                  currentVersion:
                    description: CurrentVersion is the lowest Talos version found
                      on the selected nodes.
                    type: string
                  lastCheckTime:
                    description: LastCheckTime is when the releases were last evaluated.
                    format: date-time
                    type: string
                  lastCreatedPlan:
                    description: LastCreatedPlan is the name of the most recent child
                      PatchPlan.
                    type: string
                  latestVersion:
                    description: LatestVersion is the newest stable upstream release,
                      regardless of age or the allow setting.
                    type: string
                  pendingVersion:
                    description: PendingVersion is a newer release that is still younger
                      than minReleaseAge.
                    type: string
                type: object
              completedNodes:
                default: 0
                description: CompletedNodes is the number of nodes successfully patched
                  (derived from PatchJobs)
                type: integer
              completionTime:
                description: CompletionTime is when the patching operation completed
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the PatchPlan's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failedNodes:
                default: 0
                description: FailedNodes is the number of nodes that failed to patch
                  (derived from PatchJobs)
                type: integer
              failuresAcknowledged:
                description: |-
                  FailuresAcknowledged is the number of failed nodes a user accepted by resuming a plan that
                  the Pause failure policy paused. Only failures beyond it count towards the policy.
                type: integer
              groups:
                description: Groups reports the rollout progress per group, in strategy.order.
                items:
                  description: GroupStatus is the rollout progress of one group.
                  properties:
                    active:
                      description: Active is the number of Leases currently held by
                        the group.
                      type: integer
                    completed:
                      description: Completed is the number of nodes patched successfully.
                      type: integer
                    concurrency:
                      description: Concurrency is the configured maximum of simultaneously
                        active PatchJobs.
                      type: integer
                    failed:
                      description: Failed is the number of nodes whose PatchJob failed.
                      type: integer
                    name:
                      description: Name is the group name.
                      type: string
                    pending:
                      description: Pending is the number of nodes without a PatchJob
                        yet.
                      type: integer
                    running:
                      description: Running is the number of nodes whose PatchJob has
                        not finished.
                      type: integer
                    total:
                      description: Total is the number of unique nodes this group
                        schedules.
                      type: integer
                  required:
                  - active
                  - completed
                  - concurrency
                  - failed
                  - name
                  - pending
                  - running
                  - total
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              historyPurged:
                description: |-
                  HistoryPurged is set once the finished PatchJobs were removed after spec.retention.history.
                  The plan is frozen from then on.
                type: boolean
              kubeProxyUpgraded:
                description: |-
                  KubeProxyUpgraded indicates whether the cluster-wide kube-proxy DaemonSet image has been
                  rolled out to match spec.target.kubernetesVersion. Only meaningful when kubernetesVersion is
                  set; control plane nodes are upgraded before this is attempted, and worker nodes wait for it.
                type: boolean
              lastNodeScheduledAt:
                description: |-
                  LastNodeScheduledAt is when the last PatchJob was created
                  Used to enforce DelayBetweenNodes
                format: date-time
                type: string
              message:
                description: Message contains human-readable message about current
                  state
                type: string
              pendingNodes:
                default: 0
                description: PendingNodes is the number of nodes that have no PatchJob
                  yet (derived from PatchJobs)
                type: integer
              phase:
                description: Phase represents the current phase of the patching operation
                enum:
                - Pending
                - Preflighting
                - InProgress
                - Paused
                - Cancelled
                - Completed
                - Failed
                - Watching
                type: string
              runningNodes:
                default: 0
                description: RunningNodes is the number of nodes with a PatchJob that
                  has not finished (derived from PatchJobs)
                type: integer
              startTime:
                description: StartTime is when the patching operation started
                format: date-time
                type: string
              targetKubernetesVersion:
                description: TargetKubernetesVersion is the display Kubernetes version
                  extracted from spec.target
                type: string
              targetTalosVersion:
                description: TargetTalosVersion is the display Talos version extracted
                  from spec.target
                type: string
              totalNodes:
                description: |-
                  TotalNodes is the number of unique nodes the rollout covers: selected by nodeSelector and
                  claimed by a group in strategy.order.
                type: integer
            required:
            - completedNodes
            - failedNodes
            - pendingNodes
            - runningNodes
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
