apiVersion: kangalpatch.ozalp.dk/v1alpha1
kind: PatchPlan
metadata:
  name: simple-upgrade
spec:
  # Target Talos version to upgrade to
  target:
    talosVersion: v1.11.6
    source: factory
    installer: nocloud
    schematicID: 95d432d6bb450a67e801a6ae77c96a67e38820b62ba4159ae7e997e1695207f7
    secureBoot: true

  # Node selection: the complete population of the plan
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux

  # Only worker nodes are patched; controlPlane is not listed
  strategy:
    order: [workers]
  groups:
    workers:
      concurrency: 1

  # Delay between scheduling nodes
  delayBetweenNodes: "300s"     # Wait 5 minutes between scheduling nodes

  # Failure handling
  failurePolicy:
    type: Halt
    maxFailures: 1      # Halt after the first failed node

  # Drain settings
  respectPDBs: true
  drainTimeout: "5m"
  rebootTimeout: "10m"

  # Pause control (can be toggled to pause/resume)
  paused: false

  # Talos API configuration (use secretRef in production)
  talosConfig:
    endpoints:
      - 192.168.1.250:50000
    secretRef:
      name: talos-credentials
      namespace: kangal-patch
